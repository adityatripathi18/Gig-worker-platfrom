<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SahakariSeva — Cooperative Gig Services Platform</title>
  
  <!-- SEO & Meta Tags -->
  <meta name="description" content="Cooperative Gig Services Platform connecting households with verified skilled workers from labor cooperatives with transparent pricing and real-time tracking.">
  <meta name="keywords" content="Cooperative Services, Gig Workers, Electrician, Plumber, AC Repair, Mathura, GLA University">
  <meta name="theme-color" content="#171e19">

  <!-- Design System Typography: Nunito Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,400;1,700;1,900&display=swap" rel="stylesheet">

  <!-- Core Design System CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ====================================================================
       GLOBAL TOP BAR: MULTI-EXPERIENCE ROLE SWITCHER & VIEWPORT CONTROLS
       ==================================================================== -->
  <header class="global-top-bar" id="global-top-bar">
    <div class="brand-badge">
      <div class="brand-badge-icon">🤝</div>
      <div>
        SahakariSeva
        <span>Cooperative Gig Platform</span>
      </div>
    </div>

    <!-- Role Switcher -->
    <div class="role-switcher-group" id="role-switcher-container">
      <button class="role-btn active" data-role="customer">
        <span class="role-dot"></span>
        <span>Customer App</span>
      </button>
      <button class="role-btn" data-role="worker">
        <span class="role-dot"></span>
        <span>Worker Portal</span>
      </button>
      <button class="role-btn" data-role="coop">
        <span class="role-dot"></span>
        <span>Cooperative Admin</span>
      </button>
      <button class="role-btn" data-role="admin">
        <span class="role-dot"></span>
        <span>Platform Federation</span>
      </button>
    </div>

    <!-- Viewport Frame Switcher -->
    <div class="viewport-controls">
      <button class="view-btn" id="toggle-viewport-btn">
        <span id="vp-icon">📱</span>
        <span id="vp-mode-label">Mobile Frame</span>
      </button>
    </div>
  </header>

  <!-- ====================================================================
       MASTER CONTAINER / SMARTPHONE DEVICE MOCKUP CANVAS
       ==================================================================== -->
  <main class="app-viewport-wrapper" id="viewport-wrapper">
    <div class="mobile-device-shell" id="mobile-shell">
      
      <!-- Device Status Bar (Time, Camera Notch, Battery) -->
      <div class="device-status-bar" id="device-status-bar">
        <span id="clock-display">09:41</span>
        
        <!-- Dynamic Island / Camera Notch -->
        <div class="status-notch">
          <div class="notch-camera-dot"></div>
        </div>

        <div class="status-icons">
          <span>5G</span>
          <span>📶</span>
          <span>100%</span>
        </div>
      </div>

      <!-- Main Scrollable Screen Content Container -->
      <div class="app-screen-scrollable" id="main-screen-container">
        <!-- Rendered dynamically by js/app.js -->
      </div>

      <!-- ================================================================
           FIXED FLOATING BOTTOM NAVIGATION BAR
           (Home, Bookings, Central Red Action, Services, Profile)
           ================================================================ -->
      <nav class="floating-bottom-nav" id="floating-bottom-nav">
        <!-- Injected dynamically by App.renderBottomNav() -->
      </nav>

    </div>
  </main>

  <!-- ====================================================================
       MODAL & BOTTOM SHEET OVERLAY
       ==================================================================== -->
  <div class="modal-overlay" id="modal-overlay">
    <!-- Rendered dynamically for Location, Worker Profile, More Menu, etc. -->
  </div>

  <!-- Real-time Clock Script -->
  <script>
    function updateClock() {
      const now = new Date();
      const hrs = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const clockEl = document.getElementById('clock-display');
      if (clockEl) clockEl.textContent = `${hrs}:${mins}`;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>

  <!-- Application Logic Scripts -->
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
